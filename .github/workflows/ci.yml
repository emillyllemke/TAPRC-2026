name: CI/CD

on:
  push:
    branches: ["main"]

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 --version
      - run: python3 -m py_compile function_app.py

      # Instalação das dependências de validação (ruff, black e isort)
      - name: Instalar ferramentas de lint e formatação
        run: pip install ruff black isort

      # 1. VERIFICAÇÃO DE IMPORTS: isort
      - name: Verificação de imports (isort)
        run: isort --check-only --profile black .

      # 2. FORMATAÇÃO AUTOMÁTICA: black
      - name: Formatação automática (Black)
        run: black --check .

      # 3. LINTING: ruff
      - name: Linting e padrões PEP8 (Ruff)
        run: ruff check .

  deploy:
    needs: validar
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      AZURE_FUNCTIONAPP_NAME: 'funcapp-taprc-emilly'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: .
          remote-build: true